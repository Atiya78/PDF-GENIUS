# Railway config-as-code. Build/start commands and Debian Trixie Chrome
# dependencies are defined in the repository's railpack.json.
# Runtime aptPackages deliberately replaces Railpack's generated Puppeteer list
# (no "..."), which includes obsolete Debian package names. Build dependencies
# extend the generated list so native module build requirements are preserved.
# Remove stale RAILPACK_BUILD_APT_PACKAGES / RAILPACK_DEPLOY_APT_PACKAGES service
# overrides if present; package lists are maintained in railpack.json instead.
#
# The production server (@workspace/api-server) serves the web app's prebuilt
# output (artifacts/pdf-convert-master/dist/public), so a deploy MUST trigger
# whenever EITHER the server OR the web app (or a shared lib / lockfile)
# changes. Previously only the api-server folder was watched, so web-only
# commits were skipped ("No changes to watched files").
[build]
watchPatterns = [
  "artifacts/api-server/**",
  "artifacts/pdf-convert-master/**",
  "lib/**",
  "pnpm-workspace.yaml",
  "pnpm-lock.yaml",
  "package.json",
  "railway.toml",
  "railpack.json",
]
