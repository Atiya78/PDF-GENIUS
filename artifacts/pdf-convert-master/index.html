<!DOCTYPE html>

  <head>
    <!-- Google tag stub. gtag.js itself is loaded only after cookie consent
         (src/lib/consent.ts); until then Consent Mode stays "denied". -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', analytics_storage: 'denied'
      });
      // Download conversion (called by shared helpers) — only sent with consent.
      function gtag_report_conversion() {
        if (!window.__adsConsent) return false;
        gtag('event', 'conversion', {
          'send_to': 'AW-18278560130/32ZgCLu44MYcEILj8otE',
          'value': 1.0,
          'currency': 'USD'
        });
        return false;
      }
    </script>

    <style>
      /* Boot loader shown before the JS bundle mounts React. React replaces the
         #root children on first render, removing this automatically. Mirrors the
         in-app processing animation (navy dot-ring on a light surface). */
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9fafb;
      }
      #boot-loader .ring {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 5px solid #e5e7eb;
        border-top-color: #0b1220;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader" aria-label="Loading">
        <div class="ring"></div>
      </div>
    </div>
