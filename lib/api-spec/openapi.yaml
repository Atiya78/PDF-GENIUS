openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /education/translate:
    post:
      operationId: translateEducationPdf
      tags: [education]
      summary: Stream translated pages with signed resumable receipts; charge only a completed document
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EducationTranslationInput" }
      responses:
        "200":
          description: Newline-delimited progress events
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/EducationTranslationEvent" }
            application/json:
              schema: { $ref: "#/components/schemas/EducationTranslationEvent" }
  /education/exam-paper:
    post:
      operationId: generateEducationExam
      tags: [education]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EducationExamInput" }
      responses:
        "200":
          description: Exam paper and marking scheme
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EducationExamPaper" }
  /education/exam-paper/regenerate:
    post:
      operationId: regenerateEducationExamQuestion
      tags: [education]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EducationExamRegenerateInput" }
      responses:
        "200":
          description: Paper with only the selected question regenerated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EducationExamPaper" }
  /education/summary:
    post:
      operationId: generateEducationSummary
      tags: [education]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EducationNotesInput" }
      responses:
        "200":
          description: Page-referenced editable summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EducationNotes" }
  /education/mind-map:
    post:
      operationId: generateEducationMindMap
      tags: [education]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EducationNotesInput" }
      responses:
        "200":
          description: Editable hierarchical mind-map outline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EducationNotes" }
  /education/ask-pdf/starters:
    post:
      operationId: generateEducationStarters
      tags: [education]
      summary: Generate source-grounded starter questions without spending credits
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EducationStudySource" }
      responses:
        "200":
          description: Starter questions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EducationStarters" }
        "503":
          description: AI unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EducationProblem" }
  /education/ask-pdf:
    post:
      operationId: askEducationPdf
      tags: [education]
      summary: Answer from retrieved PDF passages; uses the shared successful-generation allowance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EducationChatInput" }
      responses:
        "200":
          description: Grounded answer or explicit not-found response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EducationChatAnswer" }
        "402":
          description: No credits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EducationProblem" }
        "409":
          description: Duplicate request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EducationProblem" }
  /education/notes:
    post:
      operationId: generateEducationNotes
      tags: [education]
      summary: Generate editable study notes using every selected source chunk
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EducationNotesInput" }
      responses:
        "200":
          description: Study notes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EducationNotes" }
        "402":
          description: No credits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EducationProblem" }
  /education/font:
    get:
      operationId: getEducationFont
      tags: [education]
      summary: Licensed Bengali font for study material
      responses:
        "200":
          description: Noto Sans Bengali font
          content:
            font/ttf:
              schema: { type: string, format: binary }
  /education/extract:
    post:
      operationId: extractEducationPdf
      tags: [education]
      summary: Read a temporary text PDF with numbered pages
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/EducationPdfInput"
      responses:
        "200":
          description: Extracted pages; nothing is stored on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EducationExtraction"
        "400":
          $ref: "#/components/responses/EducationError"
        "413":
          $ref: "#/components/responses/EducationError"
        "429":
          $ref: "#/components/responses/EducationError"
  /education/quiz:
    post:
      operationId: generateEducationQuiz
      tags: [education]
      summary: Generate a document-grounded quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EducationQuizInput"
      responses:
        "200":
          description: Validated quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EducationQuiz"
        "400":
          $ref: "#/components/responses/EducationError"
        "429":
          $ref: "#/components/responses/EducationError"
        "503":
          $ref: "#/components/responses/EducationError"
  /education/flashcards:
    post:
      operationId: generateEducationFlashcards
      tags: [education]
      summary: Generate a document-grounded flashcard deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EducationFlashcardInput"
      responses:
        "200":
          description: Validated flashcard deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EducationDeck"
        "400":
          $ref: "#/components/responses/EducationError"
        "429":
          $ref: "#/components/responses/EducationError"
        "503":
          $ref: "#/components/responses/EducationError"
  /education/export:
    post:
      operationId: exportEducation
      tags: [education]
      summary: Export an edited quiz or printable deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EducationExportInput"
      responses:
        "200":
          description: PDF or DOCX file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/EducationError"
        "503":
          $ref: "#/components/responses/EducationError"
  /education/events:
    post:
      operationId: recordEducationEvent
      tags: [education]
      summary: First-party activity counts, without document content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EducationEvent"
      responses:
        "204":
          description: Recorded
  /education/history:
    get:
      operationId: listEducationHistory
      tags: [education]
      summary: List the signed-in user's successful study results from the last 24 hours
      responses:
        "200":
          description: Saved study results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EducationHistoryEntry" }
        "401":
          $ref: "#/components/responses/EducationError"
  /education/history/{id}:
    get:
      operationId: getEducationHistory
      tags: [education]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Saved study material
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EducationSavedResult" }
        "404":
          $ref: "#/components/responses/EducationError"
    delete:
      operationId: deleteEducationHistory
      tags: [education]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  responses:
    EducationError:
      description: Friendly processing error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EducationProblem"
  schemas:
    EducationProblem:
      type: object
      required: [error]
      properties:
        error: { type: string }
        ocrUrl: { type: string }
    EducationPdfInput:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        pageRange: { type: string, maxLength: 100 }
    EducationSourcePage:
      type: object
      required: [pageNumber, text]
      properties:
        pageNumber: { type: [integer, "null"], minimum: 1, maximum: 100000 }
        text: { type: string, maxLength: 250000 }
    EducationExtraction:
      type: object
      required: [pages, totalPages, usedOcr, warnings]
      properties:
        pages:
          type: array
          items: { $ref: "#/components/schemas/EducationSourcePage" }
        totalPages: { type: integer }
        usedOcr: { type: boolean }
        warnings: { type: array, items: { type: string } }
    EducationQuizInput:
      type: object
      required: [pages, count, questionTypes, difficulty, language]
      properties:
        pages:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/EducationSourcePage" }
        count: { type: integer, minimum: 5, maximum: 50 }
        requestId: { type: string, format: uuid }
        questionTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [mcq, true-false, short-answer, fill-blank] }
        difficulty: { type: string, enum: [easy, medium, hard, mixed] }
        language: { type: string, enum: [english, bangla, same] }
        topicFocus: { type: string, maxLength: 200 }
    EducationFlashcardInput:
      type: object
      required: [pages, count, style, language]
      properties:
        pages:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/EducationSourcePage" }
        count: { type: integer, minimum: 10, maximum: 100 }
        requestId: { type: string, format: uuid }
        style: { type: string, enum: [term-definition, question-answer, concept-explanation, cloze] }
        language: { type: string, enum: [english, bangla, same] }
    EducationQuestion:
      type: object
      required: [id, type, question, options, correctAnswer, explanation, difficulty, sourcePage]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [mcq, true-false, short-answer, fill-blank] }
        question: { type: string, minLength: 1, maxLength: 3000 }
        options: { type: array, maxItems: 4, items: { type: string, maxLength: 600 } }
        correctAnswer: { type: string, minLength: 1, maxLength: 3000 }
        explanation: { type: string, minLength: 1, maxLength: 3000 }
        difficulty: { type: string, enum: [easy, medium, hard] }
        sourcePage: { type: [integer, "null"], minimum: 1, maximum: 100000 }
    EducationQuiz:
      type: object
      required: [title, questions]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        questions:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/EducationQuestion" }
    EducationCard:
      type: object
      required: [id, front, back, sourcePage]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        front: { type: string, minLength: 1, maxLength: 3000 }
        back: { type: string, minLength: 1, maxLength: 3000 }
        sourcePage: { type: [integer, "null"], minimum: 1, maximum: 100000 }
    EducationDeck:
      type: object
      required: [title, cards]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        cards:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/EducationCard" }
    EducationExportInput:
      type: object
      required: [kind, format]
      properties:
        kind: { type: string, enum: [questions, answers, cards, quiz, chat, notes, translation, exam-paper, exam-key] }
        format: { type: string, enum: [pdf, docx, txt, markdown, csv, html] }
        quiz: { $ref: "#/components/schemas/EducationQuiz" }
        deck: { $ref: "#/components/schemas/EducationDeck" }
        chat: { $ref: "#/components/schemas/EducationChatTranscript" }
        notes: { $ref: "#/components/schemas/EducationNotes" }
        translation: { $ref: "#/components/schemas/EducationTranslation" }
        exam: { $ref: "#/components/schemas/EducationExamPaper" }
    EducationHistoryEntry:
      type: object
      required: [id, kind, title, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [quiz, flashcards, chat, notes, translation, exam, summary, mindmap] }
        title: { type: string }
        createdAt: { type: string }
    EducationSavedResult:
      type: object
      required: [id, kind, title, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [quiz, flashcards, chat, notes, translation, exam, summary, mindmap] }
        title: { type: string }
        createdAt: { type: string }
        quiz: { $ref: "#/components/schemas/EducationQuiz" }
        deck: { $ref: "#/components/schemas/EducationDeck" }
        chat: { $ref: "#/components/schemas/EducationChatAnswer" }
        notes: { $ref: "#/components/schemas/EducationNotes" }
        translation: { $ref: "#/components/schemas/EducationTranslation" }
        exam: { $ref: "#/components/schemas/EducationExamPaper" }
    EducationTranslationInput:
      type: object
      required: [pages, direction, keepTechnicalEnglish]
      properties:
        pages: { type: array, minItems: 1, maxItems: 500, items: { $ref: "#/components/schemas/EducationSourcePage" } }
        direction: { type: string, enum: [bangla-to-english, english-to-bangla, auto] }
        keepTechnicalEnglish: { type: boolean }
        requestId: { type: string, format: uuid }
        completed: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/EducationTranslationReceipt" } }
        retryPages: { type: array, maxItems: 500, items: { type: integer, minimum: 1 } }
    EducationTranslatedPage:
      type: object
      required: [pageNumber, text, sourceLanguage, targetLanguage]
      properties:
        pageNumber: { type: integer, minimum: 1 }
        text: { type: string, maxLength: 500000 }
        sourceLanguage: { type: string, enum: [bangla, english] }
        targetLanguage: { type: string, enum: [bangla, english] }
    EducationTranslationReceipt:
      type: object
      required: [page, expiresAt, signature]
      properties:
        page: { $ref: "#/components/schemas/EducationTranslatedPage" }
        expiresAt: { type: integer }
        signature: { type: string, minLength: 40, maxLength: 100 }
    EducationTranslation:
      type: object
      required: [title, pages]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        pages: { type: array, minItems: 1, maxItems: 500, items: { $ref: "#/components/schemas/EducationTranslatedPage" } }
    EducationTranslationEvent:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [progress, page, page-error, partial, complete, error, heartbeat] }
        pageNumber: { type: integer }
        completed: { type: integer }
        total: { type: integer }
        message: { type: string }
        receipt: { $ref: "#/components/schemas/EducationTranslationReceipt" }
        result: { $ref: "#/components/schemas/EducationTranslation" }
    EducationExamSection:
      type: object
      required: [id, kind, count, marksPerQuestion]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, enum: [mcq, short, broad] }
        count: { type: integer, minimum: 1, maximum: 30 }
        marksPerQuestion: { type: integer, minimum: 1, maximum: 100 }
    EducationExamSettings:
      type: object
      required: [institution, examName, subject, className, totalMarks, time, format, language, sections]
      properties:
        institution: { type: string, minLength: 1, maxLength: 150 }
        examName: { type: string, minLength: 1, maxLength: 150 }
        subject: { type: string, minLength: 1, maxLength: 150 }
        className: { type: string, minLength: 1, maxLength: 100 }
        totalMarks: { type: integer, minimum: 1, maximum: 1000 }
        time: { type: string, minLength: 1, maxLength: 100 }
        format: { type: string, enum: [standard, bangladesh-board] }
        language: { type: string, enum: [english, bangla, same] }
        sections: { type: array, minItems: 1, maxItems: 3, items: { $ref: "#/components/schemas/EducationExamSection" } }
    EducationMarkingPoint:
      type: object
      required: [text, marks]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
        marks: { type: number, minimum: 0.5, maximum: 100 }
    EducationCreativePart:
      type: object
      required: [label, text, answer, marks, markingScheme]
      properties:
        label: { type: string, enum: [ক, খ, গ, ঘ] }
        text: { type: string, minLength: 1, maxLength: 2000 }
        answer: { type: string, minLength: 1, maxLength: 5000 }
        marks: { type: integer, minimum: 1, maximum: 4 }
        markingScheme: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/EducationMarkingPoint" } }
    EducationExamQuestion:
      type: object
      required: [id, sectionId, kind, text, options, correctOption, stimulus, parts, answer, markingScheme, sourcePages]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        sectionId: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, enum: [mcq, short, broad] }
        text: { type: string, minLength: 1, maxLength: 5000 }
        options: { type: array, maxItems: 4, items: { type: string, minLength: 1, maxLength: 1000 } }
        correctOption: { type: [integer, "null"], minimum: 0, maximum: 3 }
        stimulus: { type: string, maxLength: 8000 }
        parts: { type: array, maxItems: 4, items: { $ref: "#/components/schemas/EducationCreativePart" } }
        answer: { type: string, minLength: 1, maxLength: 8000 }
        markingScheme: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/EducationMarkingPoint" } }
        sourcePages: { type: array, maxItems: 30, items: { type: integer, minimum: 1 } }
    EducationExamPaper:
      type: object
      required: [title, settings, questions]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        settings: { $ref: "#/components/schemas/EducationExamSettings" }
        questions: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/EducationExamQuestion" } }
    EducationExamInput:
      type: object
      required: [pages, settings]
      properties:
        pages: { type: array, minItems: 1, maxItems: 500, items: { $ref: "#/components/schemas/EducationSourcePage" } }
        settings: { $ref: "#/components/schemas/EducationExamSettings" }
        requestId: { type: string, format: uuid }
    EducationExamRegenerateInput:
      type: object
      required: [pages, paper, questionId]
      properties:
        pages: { type: array, minItems: 1, maxItems: 500, items: { $ref: "#/components/schemas/EducationSourcePage" } }
        paper: { $ref: "#/components/schemas/EducationExamPaper" }
        questionId: { type: string, minLength: 1, maxLength: 100 }
        requestId: { type: string, format: uuid }
    EducationStudySource:
      type: object
      required: [pages, language]
      properties:
        pages:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/EducationSourcePage" }
        language: { type: string, enum: [english, bangla, same] }
    EducationStarters:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          minItems: 1
          maxItems: 4
          items: { type: string, minLength: 1, maxLength: 300 }
    EducationChatInput:
      type: object
      required: [pages, language, question]
      properties:
        pages:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/EducationSourcePage" }
        language: { type: string, enum: [english, bangla, same] }
        requestId: { type: string, format: uuid }
        question: { type: string, minLength: 2, maxLength: 2000 }
        conversation:
          type: array
          maxItems: 6
          items:
            type: object
            required: [question, answer]
            properties:
              question: { type: string, minLength: 1, maxLength: 2000 }
              answer: { type: string, minLength: 1, maxLength: 6000 }
    EducationCitation:
      type: object
      required: [pageNumber, quote]
      properties:
        pageNumber: { type: integer, minimum: 1, maximum: 100000 }
        quote: { type: string, minLength: 12, maxLength: 600 }
    EducationChatAnswer:
      type: object
      required: [title, question, answer, found, citations]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        question: { type: string, minLength: 2, maxLength: 2000 }
        answer: { type: string, minLength: 1, maxLength: 6000 }
        found: { type: boolean }
        retrieval: { type: string, enum: [embeddings, bm25] }
        citations:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/EducationCitation" }
    EducationChatTranscript:
      type: object
      required: [title, turns]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        turns:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/EducationChatAnswer" }
    EducationNotesInput:
      type: object
      required: [pages, language, style]
      properties:
        pages:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/EducationSourcePage" }
        language: { type: string, enum: [english, bangla, same] }
        requestId: { type: string, format: uuid }
        style: { type: string, enum: [detailed, summary, bullets, cornell, mind-map] }
    EducationNoteSection:
      type: object
      required: [id, heading, body, sourcePages]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        heading: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 12000 }
        sourcePages:
          type: array
          maxItems: 30
          items: { type: integer, minimum: 1, maximum: 100000 }
    EducationNotes:
      type: object
      required: [title, style, sections, takeaways]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        style: { type: string, enum: [detailed, summary, bullets, cornell, mind-map] }
        sections:
          type: array
          minItems: 1
          maxItems: 80
          items: { $ref: "#/components/schemas/EducationNoteSection" }
        takeaways:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 2000 }
    EducationEvent:
      type: object
      required: [event, tool]
      properties:
        event: { type: string, enum: [upload, generate, export, quiz_completed] }
        tool: { type: string, enum: [quiz-generator, flashcards] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

